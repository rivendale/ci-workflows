name: AI review panel

# The one AI code review definition for every rivendale repo.
#
# Callers do not choose a model. They declare how much the change is worth
# reviewing and this decides, so the tiering lives in one file instead of
# drifting across a dozen caller workflows:
#
#   luna  ($0.20 / $1.20 per MTok)  routine changes, the default
#   terra ($2.00 / $12.00)          anything touching a sensitive path
#   sol   ($5.00 / $30.00)          asked for explicitly, by label or dispatch
#
# Protocol Wealth repos are deliberately out of scope; they live in the
# Protocol-Wealth org and are reviewed under a separate process.

on:
  workflow_call:
    inputs:
      base:
        description: Branch to review against.
        type: string
        default: main
      # Underscores, not hyphens: `-` is subtraction in a GitHub expression, so
      # `inputs.sensitive-paths` parses as `inputs.sensitive - paths` and the
      # run fails at startup before a single step executes.
      sensitive_paths:
        description: |
          Newline-separated globs that force the mid tier. Defaults cover the
          things whose failure modes are expensive: auth, secrets, database
          schema, CI definitions, and dependency manifests.
        type: string
        default: |
          **/auth/**
          **/identity/**
          **/guardian/**
          **/credentials*
          **/*secret*
          **/db/**
          **/*.sql
          .github/workflows/**
          **/package.json
          **/pnpm-lock.yaml
          **/requirements*.txt
      escalate_label:
        description: PR label that forces the top tier.
        type: string
        default: deep-review
    secrets:
      OPENAI_API_KEY:
        description: |
          API key for the reviewer. The Codex CLI's interactive session auth
          does NOT work here; CI needs a real key.
        required: true

# One review per PR. A force-push while a review is running should cancel it
# rather than pay for both.
concurrency:
  group: ai-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are not ready to be reviewed and would otherwise be reviewed on
    # every push.
    #
    # Fork pull requests are skipped, not failed. GitHub does not give them
    # secrets, by design, so the reviewer cannot run -- and reporting that as
    # a failure tells an outside contributor their PR is broken when the panel
    # is simply not available to it. Skipping says the same thing honestly.
    #
    # Dependabot pull requests are skipped for a DIFFERENT and stronger reason:
    # their diff is attacker-influenced. A lockfile or manifest entry comes
    # from the registry, so a compromised package controls text that this
    # reviewer reads -- while the reviewer runs with sandbox_mode
    # danger-full-access and the API key in its environment. A prompt injection
    # in that diff could exfiltrate the key. Every other PR the panel reviews
    # comes from a branch someone with push access wrote.
    #
    # Reviewing them anyway was tried and reverted. It needs the key in the
    # Dependabot secret store, and that is precisely what hands an
    # attacker-influenced diff a live credential. The review was not worth it:
    # an LLM reading "fast-uri 3.1.2 -> 3.1.5" cannot tell whether the package
    # is malicious. Dependabot's own advisories and CodeQL do that work.
    #
    # The test is the PR's AUTHOR, not github.actor. Checking the actor would
    # leave the dangerous case open -- a human re-running or labelling a
    # Dependabot PR makes the actor human, which is exactly when Actions
    # secrets DO become available to that attacker-influenced diff.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Literal, not an expression: job-level timeout-minutes does not accept
    # one, and the run fails at startup with no usable message when it does.
    #
    # BACKSTOP ONLY. The operative budget is on the Review step, and the
    # difference matters: a JOB timeout is a kill, so GitHub marks the job
    # `cancelled` and skips every `if: always()` step -- Post the review, Fail
    # if the reviewer never ran, and the review.md fallback all fail to run.
    # The PR then gets no comment at all and `gh pr checks` renders the
    # cancellation as "fail", which reads like a verdict the panel never
    # reached. Seen on rivendale/rygiel-family#374: three runs cancelled at
    # exactly 15m10s with nothing posted.
    #
    # A STEP timeout fails the step instead, leaving the reporting steps alive.
    #
    # The headroom is deliberate and has to be generous. THIS clock starts at
    # job start; the Review step's 18 starts only after checkout with
    # fetch-depth: 0, tier selection, Node setup and a global npm install. On a
    # large repo or a slow runner those can eat many minutes, and if they eat
    # enough the backstop fires first and recreates the silent cancellation this
    # change exists to prevent.
    #
    # The budget must cover setup AND the review AND the reporting after it.
    # 35 was still wrong: setup(17) + review(18) lands exactly on the backstop,
    # so a slow-setup run would be killed the instant the reviewer finished,
    # before the comment could be posted. Reporting needs its own room.
    #
    #   setup  up to ~17   +  review 18  +  reporting ~3   =  38
    #
    # 45 leaves margin on top of that. This number must NEVER be the binding
    # constraint -- if it is ever the one that fires, the panel goes silent
    # again, so err high. A fix whose correctness depends on which of two
    # timeouts fires first is not fixed until the ordering is guaranteed rather
    # than merely likely.
    #
    # KNOWN RESIDUAL, stated rather than dropped: this is still ordering, not a
    # guarantee. A pathologically slow checkout, npm install or GitHub API call
    # could consume the budget and let the JOB timeout fire, which skips the
    # reporting steps and reproduces the silent cancellation. The structural fix
    # is a SEPARATE reporting job (`needs: review, if: always()`) that cannot be
    # killed by the review job's clock -- it survives any failure of the job it
    # reports on. Not done here: it needs the report passed between jobs as an
    # artifact plus its own checkout, which is a larger change with its own new
    # failure modes, and trading a bounded tested fix for an untested restructure
    # is how the next 15m10s gets introduced. Raised by ryg-pr-review.sh
    # 2026-08-08; do it deliberately, not as a footnote to this one.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The reviewer diffs against the base branch, so it needs history.
          fetch-depth: 0

      - name: Materialise the base branch
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          # checkout leaves a detached HEAD at the PR's merge ref, so there is no
          # local branch for `--base` to resolve and the reviewer aborts with
          # "no such branch". fetch-depth: 0 means the objects are already here;
          # this only gives them a local name.
          git fetch --no-tags origin "+refs/heads/$BASE:refs/heads/$BASE" 2>/dev/null \
            || git branch -f "$BASE" "origin/$BASE"
          git rev-parse --verify "$BASE" >/dev/null

      - name: Choose the tier
        id: tier
        env:
          SENSITIVE_PATHS: ${{ inputs.sensitive_paths }}
          ESCALATE_LABEL: ${{ inputs.escalate_label }}
          BASE: ${{ inputs.base }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # An explicit ask wins over everything else.
          if printf '%s' "$LABELS" | grep -qi "\"$ESCALATE_LABEL\""; then
            echo "model=gpt-5.6-luna" >> "$GITHUB_OUTPUT"
            echo "effort=max" >> "$GITHUB_OUTPUT"
            echo "reason=labelled $ESCALATE_LABEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "origin/$BASE"...HEAD || true)
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # shellcheck disable=SC2254 -- the pattern is a glob on purpose
              case "$file" in
                $pattern)
                  echo "model=gpt-5.6-luna" >> "$GITHUB_OUTPUT"
                  echo "effort=xhigh" >> "$GITHUB_OUTPUT"
                  echo "reason=touches $file" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
            done <<< "$changed"
          done <<< "$SENSITIVE_PATHS"

          echo "model=gpt-5.6-luna" >> "$GITHUB_OUTPUT"
          echo "effort=medium" >> "$GITHUB_OUTPUT"
          echo "reason=routine change" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the reviewer
        # Pinned: an unpinned reviewer changes underneath every repo at once,
        # and a CLI whose flags moved would fail twelve pipelines together.
        run: npm install -g @openai/codex@0.146.0

      - name: Review
        id: review
        # The operative budget. Deliberately below the job's, so an overrunning
        # reviewer fails THIS STEP and leaves the reporting steps alive.
        # 15 was too tight in practice: 15 files / +383 completed while
        # 19 files / +409 did not, so the ceiling was being hit by ordinary PRs
        # rather than by pathological ones.
        timeout-minutes: 18
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ steps.tier.outputs.model }}
          EFFORT: ${{ steps.tier.outputs.effort }}
          BASE: ${{ inputs.base }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # The CLI does not pick the key up from the environment: it looks for
          # a stored credential and falls back to interactive session auth,
          # which on a runner means every request comes back 401.
          #
          # Not allowed to abort the step. A repo with no OPENAI_API_KEY fails
          # right here, and under `set -e` that killed the job before anything
          # could write review.md -- so the run died on an unhandled ENOENT
          # instead of saying which secret was missing. The one case the panel
          # most needs to explain was the one it explained worst.
          #
          # An EMPTY key is checked for first, and it is not a hypothetical:
          # `gh secret set NAME` reading the value from a pipe stored nothing,
          # the login below still printed "Successfully logged in" because it
          # does not validate, and every request then came back
          # "401 Missing bearer or basic authentication in header" -- which
          # reads like a bad key rather than an absent one. Counting the
          # characters keeps the key itself out of any variable.
          set +e
          key_chars=$(printenv OPENAI_API_KEY | tr -d '[:space:]' | wc -c)
          if [ "$key_chars" -eq 0 ]; then
            echo "OPENAI_API_KEY is empty on this repository." > login.log
            login_status=1
          else
            printenv OPENAI_API_KEY | codex login --with-api-key > login.log 2>&1
            login_status=$?
          fi
          set -e

          # Effort is set explicitly. Without it the CLI reviewed at effort
          # "none" here, because there is no config.toml on a runner -- a
          # reviewer that is not thinking is worse than no reviewer, since it
          # still reads as a clean review.
          # The CLI's own sandbox cannot start here: bubblewrap fails to
          # configure a network namespace inside the runner, and every git
          # command the reviewer tried came back as a bwrap error. The runner is
          # already the isolation boundary -- ephemeral, per-job, and holding
          # only a read-scoped token plus the review key -- so the wrapper is
          # dropped rather than the review being impossible.
          #
          # This does mean model-generated commands run unsandboxed on the
          # runner. Fork pull requests do not receive secrets, so an outside
          # contributor cannot reach the key; a trusted-branch PR carrying a
          # prompt injection is the residual risk, bounded by the job's
          # permissions being contents:read and pull-requests:write.
          # `--sandbox` is a top-level flag, not a `review` one; the config key
          # is how the subcommand takes it.
          #
          # Two files, because the CLI splits them meaningfully: the finished
          # review goes to stdout, and the working transcript -- every command
          # the reviewer ran and everything those commands printed -- goes to
          # stderr. Verified against this pinned version; a review with P1
          # findings still exits 0, so the exit code reports whether the
          # reviewer RAN, never what it thought.
          : > verdict.md
          : > transcript.md
          codex_status=0
          set +e
          if [ "$login_status" -eq 0 ]; then
            codex review \
              --base "$BASE" \
              --title "$TITLE" \
              -c sandbox_mode="danger-full-access" \
              -c model="$MODEL" \
              -c model_reasoning_effort="$EFFORT" \
              > verdict.md 2> transcript.md
            codex_status=$?
          fi
          set -e

          # Did the reviewer actually run? Opinions never fail the build; this
          # does, because a review that did not happen must not read as a clean
          # one.
          #
          # Every signal here is one the reviewer cannot forge:
          #
          #   1. A non-zero exit.
          #   2. A stdout with nothing in it. If the model was unreachable
          #      there is no verdict, and no amount of text on stderr can fill
          #      this in. Whitespace does not count: a blank review that posts
          #      under a green check is the exact failure this guards against.
          #
          # What this deliberately no longer does is grep the transcript for
          # error strings. The transcript holds whatever the reviewer printed --
          # files it read, pages it fetched -- so a PR that edited THIS FILE
          # made the reviewer print it, error patterns and all, and the panel
          # matched its own source and declared itself broken on a PR it had
          # reviewed correctly. A health check must never read text its subject
          # controls.
          reviewer_failed=
          if [ "$login_status" -ne 0 ]; then
            reviewer_failed="the reviewer could not authenticate; is OPENAI_API_KEY set on this repo?"
          elif [ "$codex_status" -ne 0 ]; then
            reviewer_failed="the reviewer exited $codex_status"
          elif ! grep -q '[^[:space:]]' verdict.md; then
            reviewer_failed="the reviewer produced no review"
          fi

          if [ -z "$reviewer_failed" ]; then
            # Lead with the review. Keep the transcript, since it is what makes
            # a wrong review diagnosable, but fold it away; drop the banner,
            # which is just the tool announcing itself.
            sed -e '/^OpenAI Codex v/d' \
                -e '/^workdir:/d' -e '/^model:/d' -e '/^provider:/d' \
                -e '/^approval:/d' -e '/^sandbox:/d' -e '/^reasoning /d' \
                -e '/^session id:/d' -e '/^--------$/d' \
                -e '/could not find bubblewrap/d' \
                -e '/^user$/d' -e "/^changes against/d" \
                transcript.md | sed '/./,$!d' > transcript-clean.md
            {
              cat verdict.md
              echo
              echo "<details><summary>How it got there</summary>"
              echo
              echo '```'
              tail -c 20000 transcript-clean.md
              echo '```'
              echo
              echo "</details>"
            } > "$RUNNER_TEMP/review.md"
          else
            echo "reviewer_failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "**The review did not run.** This PR has NOT been reviewed: $reviewer_failed."
              echo
              echo "Usually a missing or invalid \`OPENAI_API_KEY\` on this repo."
              echo
              echo "<details><summary>Reviewer diagnostics</summary>"
              echo
              echo "Login status: \`$login_status\` | review exit: \`$codex_status\` | key characters seen: \`$key_chars\`"
              echo
              if [ -s login.log ]; then
                echo '```'
                tail -c 800 login.log
                echo '```'
                echo
              fi
              echo '```'
              tail -c 4000 transcript.md
              echo '```'
              echo
              echo "</details>"
            } > "$RUNNER_TEMP/review.md"
          fi
          # Never fail the build on the reviewer's OPINION -- this panel
          # reports, the human decides. A review that did not HAPPEN is the
          # opposite case and does fail, through reviewer_failed above and the
          # step below. The previous wording here said the reverse; a comment
          # asserting a guarantee the code does not give is how the claude-rc
          # StandardError bug survived on three hosts.
          #
          # Written to RUNNER_TEMP, never the workspace. A caller PR can commit
          # its own review.md at the repo root, and checkout would place it right
          # where the reporting step looks -- so a Review step that died before
          # writing its own would have had PR-authored text posted under the
          # panel's name. RUNNER_TEMP is outside the checkout and a PR cannot
          # reach it. (verdict.md and transcript.md stay in the workspace safely:
          # both are truncated with `: >` before use.)
          test -s "$RUNNER_TEMP/review.md" \
            || echo "The reviewer produced no output." > "$RUNNER_TEMP/review.md"

      - name: Post the review
        # NOT always(). `concurrency: cancel-in-progress` kills the older run
        # when a new push arrives, and always() would let that dead run reach
        # this step, find outcome=cancelled, and overwrite the marker comment
        # with "not reviewed" -- potentially AFTER the newer run posted a real
        # review. That turns a reviewed PR into an apparently unreviewed one,
        # which is a worse version of the bug this branch is fixing.
        #
        # !cancelled() keeps every case this change exists for: a step-level
        # timeout is a FAILURE, not a cancellation, so the timeout report still
        # posts. Only superseded runs stay quiet, which is what they should do.
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          MODEL: ${{ steps.tier.outputs.model }}
          EFFORT: ${{ steps.tier.outputs.effort }}
          REASON: ${{ steps.tier.outputs.reason }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        with:
          script: |
            const fs = require('fs');
            // This step runs under always(), so it is the one thing that still
            // speaks when the reviewer does not. It must therefore never throw:
            // if it dies, the PR goes silent and the bare check result gets read
            // as a verdict, which is the failure this whole file is guarding.
            //
            // Gate on the Review step's OUTCOME, not on the file existing.
            // `} > file` creates and truncates the target the moment the output
            // block starts, so a step killed mid-write leaves a file that is
            // present but PARTIAL -- and a half-written review posted under the
            // panel's marker reads as a complete verdict, which is worse than
            // posting nothing. Only a step that finished can have produced a
            // whole report. The reviewer_failed path still counts as success:
            // it exits 0 and writes a deliberate diagnostic.
            const outcome = process.env.REVIEW_OUTCOME || 'unknown';
            let raw = null;
            if (outcome === 'success') {
              try {
                raw = fs.readFileSync(`${process.env.RUNNER_TEMP}/review.md`, 'utf8');
              } catch { raw = null; }
            }
            let body;
            if (raw && raw.trim()) {
              body = raw.slice(0, 60000);
            } else {
              // Report what is KNOWN, never a guessed cause. There is more than
              // one way to arrive here and only one of them is a timeout: if
              // checkout, base materialisation, tier selection or the reviewer
              // install failed, the Review step is `skipped` and never started.
              // Asserting "exceeded its time budget" there would put a false
              // statement on the PR -- the same defect class this whole change
              // exists to remove.
              // "did not run" is only true for `skipped`. On a step timeout the
              // reviewer may well have run and produced a verdict -- what failed
              // was assembling a complete report, and a partial one is not safe
              // to publish. Claiming it never ran would be another false
              // statement, just a subtler one.
              const started = outcome !== 'skipped';
              const why = {
                skipped: 'a step before the reviewer failed, so it never started',
                success: 'the step finished but left no readable report',
              }[outcome] || 'the step did not finish — most often its time budget';
              body = [
                started
                  ? '**No complete review was produced. This PR has _not_ been reviewed.**'
                  : '**The review never started. This PR has _not_ been reviewed.**',
                '',
                `Review step outcome: \`${outcome}\` — ${why}.`,
                '',
                started
                  ? 'The reviewer may have begun work, but no whole report survived, and a'
                  : 'Nothing ran, so there is no partial result either, and a'
                , 'partial review must not be posted as if it were a verdict.',
                '',
                'Treat this as **absence of a review**, not as findings. There is nothing here',
                'to go looking for.',
                '',
                'Re-run the job, or review locally with `ryg-pr-review.sh <PR>` and say so on the PR.',
              ].join('\n');
            }
            const marker = '<!-- rivendale-ai-review -->';
            const header = `${marker}\n### AI review panel — \`${process.env.MODEL}\` (effort ${process.env.EFFORT})\n_Tier chosen because: ${process.env.REASON}._\n\n`;

            // Replace this panel's previous comment rather than stacking one
            // per push, so the thread stays readable.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body: header + body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: header + body });
            }

      - name: Fail if the reviewer never ran
        if: steps.review.outputs.reviewer_failed == 'true'
        run: |
          echo "::error::The AI review panel could not reach the model; this PR was not reviewed."
          exit 1

      - name: Summarise on the run
        if: always()
        env:
          MODEL: ${{ steps.tier.outputs.model }}
          EFFORT: ${{ steps.tier.outputs.effort }}
          REASON: ${{ steps.tier.outputs.reason }}
        run: |
          {
            echo "## AI review panel"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Model | \`$MODEL\` |"
            echo "| Reasoning effort | $EFFORT |"
            echo "| Tier reason | $REASON |"
          } >> "$GITHUB_STEP_SUMMARY"
